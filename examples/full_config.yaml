# Papercut - Full Configuration Example
# This file demonstrates all available configuration options
# Run from repo root: cargo run --release -- -c examples/full_config.yaml

# ===== OUTPUT CONFIGURATION =====
output:
  # Output mode: "single" for one combined PDF, "multiple" for one PDF per source file
  # - single: All files are combined into one PDF document
  # - multiple: Each source file gets its own separate PDF
  mode: single

  # Directory where PDF files will be saved
  # Path can be relative or absolute
  directory: ./output

  # Filename for the output PDF (only used when mode is "single")
  # For "multiple" mode, filenames are derived from source files
  filename: combined_output.pdf

# ===== FILES TO CONVERT =====
files:
  # List of source code files/patterns to convert to PDF
  # Supports: individual files, glob patterns, directories

  # Example 1: Directory scanning with filters
  # Scans the entire 'src' directory recursively
  - path: src/
    # Only include Rust files
    include_types: ["rs"]
    # Exclude test files and build artifacts
    exclude:
      - "target/**"
    title: "Source Code"

  # Example 2: Glob pattern to match multiple files
  # Matches all YAML files in examples/ directory
  - path: "examples/*.yaml"
    title: "Configuration Examples"

  # Example 3: Individual files with custom titles
  - path: README.md
    title: "Project Documentation"

  - path: LICENSE
    title: "License Agreement"

  - path: Cargo.toml
    title: "Project Manifest"

  # Example 4: Pattern with wildcards
  # Matches all markdown files in docs directory
  - path: "docs/*.md"
    title: "Documentation"

# ===== SYNTAX HIGHLIGHTING =====
syntax_highlighting:
  # Enable or disable syntax highlighting
  # Requires the 'syntax-highlighting' feature to be enabled (default)
  enabled: true

  # Syntax highlighting theme name
  # Run 'papercut --list-themes' to see all available themes
  # Built-in presets: vscode-dark, vscode-light, jetbrains-darcula, jetbrains-light
  theme: vscode-light

# ===== PAGE SETTINGS =====
page:
  # Paper size: A4, Letter, or Legal
  # - A4: 210mm x 297mm (common in Europe, Asia)
  # - Letter: 8.5" x 11" (common in North America)
  # - Legal: 8.5" x 14" (common for legal documents)
  size: Letter

  # Page margins in centimeters
  margins:
    top: 2.5
    bottom: 2.5
    left: 2.0
    right: 2.0

  # Font size for code content (in points)
  # Typical values: 8-12
  font_size: 10

  # Show line numbers on the left side of code
  line_numbers: true

  # Line spacing multiplier
  # 1.0 = single spacing, 1.5 = 1.5x spacing, 2.0 = double spacing
  line_spacing: 1.2

  # Wrap long lines that exceed the page width
  wrap_long_lines: true

  # Number of spaces to indent wrapped continuation lines
  wrap_indent: 4

  # Show vertical borders on left and right of code area
  vertical_borders: false

  # Show a separator line between line numbers and code
  line_number_separator: true

# ===== PDF METADATA =====
# Note: title and author automatically fall back to cover_page values if not specified
metadata:
  # title: "..."      # Falls back to cover_page.title
  # author: "..."     # Falls back to cover_page.authors (comma-separated)

  # PDF document subject (appears in PDF properties)
  subject: "Code Review and Documentation"

  # PDF document keywords (array of strings)
  keywords:
    - source code
    - documentation
    - review

# ===== COVER PAGE CONFIGURATION =====
cover_page:
  # Enable or disable the cover page
  enabled: true

  # Main title displayed prominently on the cover page
  title: "Source Code Documentation"

  # Author(s) displayed below the title (supports single string or list)
  # Single author: authors: "John Doe"
  # Multiple authors (shown one per line):
  authors:
    - "Engineering Team"
    - "Documentation Team"

  # Description text (supports multiple lines)
  # Automatically wraps to fit the page width
  description: |
    Complete source code listing for the Papercut project.

    This document contains all source files, configuration examples,
    and documentation for code review purposes.

  # Location/URL where the source code is kept
  location: "https://github.com/your-org/papercut"

  # Date to display on the cover page
  # Leave empty to auto-generate current date (YYYY-MM-DD format)
  date: ""

  # Include table of contents listing all files
  include_toc: true

  # Font size for the title (in points)
  title_font_size: 24

  # Font size for description and other text (in points)
  text_font_size: 12

  # Font family for the cover page (default: Arial)
  # Common options: "Arial", "Helvetica", "Times New Roman", "Georgia"
  font_family: "Arial"
