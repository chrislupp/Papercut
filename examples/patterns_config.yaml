# Pattern Matching Configuration Example
# Demonstrates directory scanning, wildcards, and file filtering
# Run from repo root: cargo run --release -- -c examples/patterns_config.yaml

output:
  mode: single
  directory: ./output
  filename: papercut_source.pdf

files:
  # Scan entire src directory, only include Rust files
  - path: src/
    include_types: ["rs"]
    exclude:
      - "target/**"      # Exclude build directory

  # Include all YAML config files from examples
  - path: "examples/*.yaml"
    title: "Configuration Examples"

  # Include documentation files from docs
  - path: "docs/*.md"
    title: "Documentation"

  # Include root markdown files
  - path: "*.md"
    title: "Project Documentation"

  # Specific important files
  - path: Cargo.toml
    title: "Project Manifest"

syntax_highlighting:
  enabled: true
  theme: vscode-light

page:
  size: Letter
  font_size: 9
  line_numbers: true
  line_spacing: 1.2

header:
  enabled: true
  left: "Project Source Code"
  right: "Page {page}/{total}"

footer:
  enabled: true
  left: "{date}"
  center: "{filename}"
  right: "Generated by Papercut"

metadata:
  title: "Project Source Code Documentation"
  author: "Development Team"
  keywords: ["source", "code", "documentation"]
