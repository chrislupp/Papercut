# Pattern Matching Configuration Example
# Demonstrates directory scanning, wildcards, and file filtering

output:
  mode: single
  directory: ./output
  filename: project_code.pdf

files:
  # Scan entire src directory, only include Rust files
  - path: src/
    include_types: ["rs"]
    exclude:
      - "*.test.rs"      # Exclude test files
      - "target/**"      # Exclude build directory
      - "**/tests/**"    # Exclude test directories

  # Include all YAML config files from examples
  - path: "examples/*.yaml"
    title: "Configuration Examples"

  # Include documentation
  - path: "*.md"
    title: "Documentation"

  # Specific important files
  - path: Cargo.toml
    title: "Project Manifest"

syntax_highlighting:
  enabled: true
  theme: InspiredGitHub

page:
  size: Letter
  font_size: 9
  line_numbers: true
  line_spacing: 1.2

header:
  enabled: true
  left: "Project Source Code"
  right: "Page {page}/{total}"

footer:
  enabled: true
  left: "{date}"
  center: "{filename}"
  right: "Generated by Papercut"

metadata:
  title: "Project Source Code Documentation"
  author: "Development Team"
  keywords: ["source", "code", "documentation"]
