# Minimal Papercut Configuration
# This shows the bare minimum required to generate a PDF
# Run from repo root: cargo run --release -- -c examples/minimal_config.yaml

output:
  mode: single
  directory: ./output
  filename: output.pdf

files:
  - path: ../src/main.rs
  - path: ../src/config.rs
  - path: ../README.md

# Simple cover page (most fields use defaults)
cover_page:
  enabled: true
  title: "My Project"
