# Release Configuration Example
# Suitable for public release processes with proper disclaimers
# Run from repo root: cargo run --release -- -c examples/release_config.yaml

output:
  mode: single
  directory: ./releases
  filename: source_code_release_2024.pdf

files:
  - path: ../src/main.rs
    title: "Main Application"
  - path: ../src/config.rs
    title: "Configuration Module"
  - path: ../src/error.rs
    title: "Error Handling"
  - path: ../LICENSE
    title: "License Agreement"
  - path: ../README.md
    title: "Documentation"

syntax_highlighting:
  enabled: true
  theme: vscode-light

page:
  size: Letter
  margins:
    top: 2.5
    bottom: 2.5
    left: 2.5
    right: 2.5
  font_size: 9
  line_numbers: true
  line_spacing: 1.3

header:
  enabled: true
  left: "APPROVED FOR PUBLIC RELEASE"
  center: ""
  right: "Page {page}/{total}"
  font_size: 8

footer:
  enabled: true
  left: "Distribution Unlimited"
  center: "{filename}"
  right: "Released: {date}"
  font_size: 8

styling:
  font_family: monospace
  background_color: "#ffffff"
  text_color: "#000000"
  line_number_color: "#888888"

metadata:
  title: "Software Source Code - Public Release"
  author: "Software Engineering Division"
  subject: "Public Release Documentation"
  keywords:
    - public release
    - source code
    - distribution unlimited
    - approved

cover_page:
  enabled: true
  title: "Software Source Code"
  authors:
    - "Software Engineering Division"
    - "Quality Assurance Team"
  description: |
    APPROVED FOR PUBLIC RELEASE
    Distribution Unlimited

    This document contains the complete source code for the software package.
    All code has been reviewed and cleared for public distribution.
  location: "https://github.com/your-org/released-software"
  date: "2024-12-01"
  include_toc: true
  title_font_size: 28
  text_font_size: 11
