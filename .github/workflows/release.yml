name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Version bump type (use "promote" to release current prerelease as stable)'
        required: true
        type: choice
        options:
          - promote
          - major
          - minor
          - patch
      prerelease:
        description: 'Prerelease type (leave empty for stable release)'
        required: false
        type: choice
        options:
          - ''
          - alpha
          - beta
          - rc

permissions:
  contents: write

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.new_version }}
      tag: ${{ steps.version.outputs.tag }}
      prerelease: ${{ steps.labels.outputs.prerelease }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup GPG for signing
        run: |
          cat > /tmp/gpg_key <<EOF
          %echo Generating a basic OpenPGP key
          %no-protection
          Key-Type: RSA
          Key-Length: 4096
          Subkey-Type: RSA
          Subkey-Length: 4096
          Name-Real: github-actions[bot]
          Name-Email: github-actions[bot]@users.noreply.github.com
          Expire-Date: 0
          %commit
          %echo done
          EOF
          gpg --batch --generate-key /tmp/gpg_key
          rm /tmp/gpg_key
          echo "GPG key generated"

          KEY_ID=$(gpg --list-secret-keys --keyid-format LONG | grep sec | awk '{print $2}' | cut -d'/' -f2)
          git config --global user.signingkey $KEY_ID
          git config --global commit.gpgsign true
          git config --global tag.gpgsign true
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Parse release inputs
        id: labels
        run: |
          echo "bump=${{ inputs.bump }}" >> $GITHUB_OUTPUT
          if [ -n "${{ inputs.prerelease }}" ]; then
            echo "prerelease=true" >> $GITHUB_OUTPUT
            echo "pretype=${{ inputs.prerelease }}" >> $GITHUB_OUTPUT
          else
            echo "prerelease=false" >> $GITHUB_OUTPUT
          fi

      - name: Calculate new version
        id: version
        run: |
          # Parse current version from Cargo.toml
          CURRENT=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "Current version: $CURRENT"

          # Split version
          MAJOR=$(echo "$CURRENT" | cut -d. -f1)
          MINOR=$(echo "$CURRENT" | cut -d. -f2)
          PATCH=$(echo "$CURRENT" | cut -d. -f3 | cut -d- -f1)

          # Check if current version is a prerelease
          IS_PRERELEASE_VERSION=$(echo "$CURRENT" | grep -c '-' || true)

          # Apply bump
          BUMP="${{ steps.labels.outputs.bump }}"
          case "$BUMP" in
            promote)
              # Promote prerelease to stable - no version bump, just strip prerelease suffix
              if [ "$IS_PRERELEASE_VERSION" -eq 0 ]; then
                echo "::error::Cannot use 'promote' on a non-prerelease version. Use major/minor/patch instead."
                exit 1
              fi
              # Version numbers stay the same, prerelease suffix will not be added
              ;;
            major)
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
              ;;
            minor)
              MINOR=$((MINOR + 1))
              PATCH=0
              ;;
            patch)
              PATCH=$((PATCH + 1))
              ;;
          esac

          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"

          # Handle prerelease
          if [ "${{ steps.labels.outputs.prerelease }}" == "true" ]; then
            PRETYPE="${{ steps.labels.outputs.pretype }}"

            # Find existing prerelease tags for this version
            EXISTING=$(git tag -l "v${NEW_VERSION}-${PRETYPE}.*" | sort -V | tail -1)
            if [ -n "$EXISTING" ]; then
              # Increment prerelease number
              PRE_NUM=$(echo "$EXISTING" | sed "s/v${NEW_VERSION}-${PRETYPE}\.\([0-9]*\)/\1/")
              PRE_NUM=$((PRE_NUM + 1))
            else
              PRE_NUM=1
            fi

            NEW_VERSION="${NEW_VERSION}-${PRETYPE}.${PRE_NUM}"
          fi

          echo "New version: $NEW_VERSION"
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$NEW_VERSION" >> $GITHUB_OUTPUT

      - name: Update Cargo package version
        run: |
          sed -i 's/^version = ".*"/version = "${{ steps.version.outputs.new_version }}"/' Cargo.toml
          cargo check

      - name: Update CHANGELOG.md
        if: steps.labels.outputs.prerelease == 'false'
        run: |
          DATE=$(date +%Y-%m-%d)
          VERSION="${{ steps.version.outputs.new_version }}"

          # Add new version section after [Unreleased]
          awk -v ver="$VERSION" -v date="$DATE" '
            /^## \[Unreleased\]/ {
              print
              print ""
              print "## [" ver "] - " date
              next
            }
            { print }
          ' CHANGELOG.md > CHANGELOG.tmp && mv CHANGELOG.tmp CHANGELOG.md

      - name: Commit and tag
        run: |
          git add Cargo.toml Cargo.lock CHANGELOG.md
          git commit -S -m "chore: release version ${{ steps.version.outputs.new_version }}"
          git tag -s "${{ steps.version.outputs.tag }}" -m "Release ${{ steps.version.outputs.tag }}"
          git push origin main
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Extract changelog for release
        id: changelog
        run: |
          VERSION="${{ steps.version.outputs.new_version }}"

          # Extract section for this version
          NOTES=$(awk -v ver="$VERSION" '
            /^## \[/ {
              if (found) exit
              if (index($0, "[" ver "]") || index($0, "[Unreleased]")) found=1
              next
            }
            found { print }
          ' CHANGELOG.md)

          # Write to file for release body
          echo "$NOTES" > release_notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          body_path: release_notes.md
          prerelease: ${{ steps.labels.outputs.prerelease == 'true' }}
          draft: false

  build-macos:
    name: Build macOS DMG
    needs: release
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.tag }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: brew install librsvg create-dmg

      - name: Import Apple certificate
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          # Skip if no certificate provided
          if [ -z "$APPLE_CERTIFICATE_BASE64" ]; then
            echo "⚠️ No Apple certificate configured, skipping code signing"
            exit 0
          fi

          # Create temporary keychain
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Import certificate
          echo "$APPLE_CERTIFICATE_BASE64" | base64 --decode > $RUNNER_TEMP/certificate.p12
          security import $RUNNER_TEMP/certificate.p12 \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 \
            -k "$KEYCHAIN_PATH"

          # Allow codesign to access keychain
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

          # Clean up certificate file
          rm $RUNNER_TEMP/certificate.p12

          # Find and export signing identity
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep "Developer ID Application" | head -1 | awk -F'"' '{print $2}')
          if [ -n "$IDENTITY" ]; then
            echo "APPLE_SIGNING_IDENTITY=$IDENTITY" >> $GITHUB_ENV
            echo "✓ Found signing identity: $IDENTITY"
          else
            echo "⚠️ No Developer ID Application certificate found"
          fi

      - name: Build and package
        env:
          APPLE_SIGNING_IDENTITY: ${{ env.APPLE_SIGNING_IDENTITY }}
        run: |
          cd packaging/macos
          ./build-macos.sh
          ./create-dmg.sh

      - name: Notarize DMG
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # Skip if no signing identity or Apple ID
          if [ -z "$APPLE_SIGNING_IDENTITY" ] || [ -z "$APPLE_ID" ]; then
            echo "⚠️ Skipping notarization (missing signing identity or Apple ID)"
            exit 0
          fi

          DMG_FILE=$(ls dist/*.dmg | head -1)

          echo "📤 Submitting for notarization..."
          xcrun notarytool submit "$DMG_FILE" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_ID_PASSWORD" \
            --wait

          echo "📎 Stapling notarization ticket..."
          xcrun stapler staple "$DMG_FILE"

          echo "✓ Notarization complete"

      - name: Cleanup keychain
        if: always()
        run: |
          security delete-keychain $RUNNER_TEMP/app-signing.keychain-db 2>/dev/null || true

      - name: Upload DMG to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release.outputs.tag }}
          files: dist/*.dmg
