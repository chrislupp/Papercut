name: Release

on:
  pull_request:
    types: [closed]
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  release:
    name: Create Release
    if: >
      github.event.pull_request.merged == true &&
      (contains(github.event.pull_request.labels.*.name, 'release') ||
       contains(github.event.pull_request.labels.*.name, 'prerelease'))
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.new_version }}
      tag: ${{ steps.version.outputs.tag }}
      prerelease: ${{ steps.labels.outputs.prerelease }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Setup GPG for signing
        run: |
          cat > /tmp/gpg_key <<EOF
          %echo Generating a basic OpenPGP key
          %no-protection
          Key-Type: RSA
          Key-Length: 4096
          Subkey-Type: RSA
          Subkey-Length: 4096
          Name-Real: github-actions[bot]
          Name-Email: github-actions[bot]@users.noreply.github.com
          Expire-Date: 0
          %commit
          %echo done
          EOF
          gpg --batch --generate-key /tmp/gpg_key
          rm /tmp/gpg_key
          echo "GPG key generated"

          KEY_ID=$(gpg --list-secret-keys --keyid-format LONG | grep sec | awk '{print $2}' | cut -d'/' -f2)
          git config --global user.signingkey $KEY_ID
          git config --global commit.gpgsign true
          git config --global tag.gpgsign true
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Parse and validate release labels
        id: labels
        env:
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ' ') }}
        run: |
          echo "Labels on PR: $LABELS"

          RELEASE_COUNT=0
          PRERELEASE=false
          BUMP=""
          BUMP_COUNT=0
          PRETYPE=""
          PRETYPE_COUNT=0

          for label in $LABELS; do
            case "$label" in
              release)
                RELEASE_COUNT=$((RELEASE_COUNT + 1))
                ;;
              prerelease)
                RELEASE_COUNT=$((RELEASE_COUNT + 1))
                PRERELEASE=true
                ;;
              major|minor|patch|promote)
                BUMP="$label"
                BUMP_COUNT=$((BUMP_COUNT + 1))
                ;;
              alpha|beta|rc)
                PRETYPE="$label"
                PRETYPE_COUNT=$((PRETYPE_COUNT + 1))
                ;;
            esac
          done

          if [ "$RELEASE_COUNT" -ne 1 ]; then
            echo "::error::PR must have exactly one of 'release' or 'prerelease'."
            exit 1
          fi

          if [ "$BUMP_COUNT" -ne 1 ]; then
            echo "::error::PR must have exactly one of 'major', 'minor', 'patch', or 'promote'."
            exit 1
          fi

          if [ "$PRERELEASE" = "true" ] && [ "$PRETYPE_COUNT" -ne 1 ]; then
            echo "::error::Prerelease PRs must have exactly one of 'alpha', 'beta', or 'rc'."
            exit 1
          fi

          if [ "$PRERELEASE" = "false" ] && [ "$PRETYPE_COUNT" -ne 0 ]; then
            echo "::error::Stable release PRs must not have 'alpha', 'beta', or 'rc'."
            exit 1
          fi

          if [ "$PRERELEASE" = "true" ] && [ "$BUMP" = "promote" ]; then
            echo "::error::The 'promote' label can only be used for a stable release."
            exit 1
          fi

          echo "bump=$BUMP" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "pretype=$PRETYPE" >> "$GITHUB_OUTPUT"

      - name: Calculate new version
        id: version
        run: |
          # Read the version before the release PR was merged.
          CURRENT=$(git show HEAD^1:Cargo.toml | grep '^version' | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "Previous version: $CURRENT"

          # Split version
          MAJOR=$(echo "$CURRENT" | cut -d. -f1)
          MINOR=$(echo "$CURRENT" | cut -d. -f2)
          PATCH=$(echo "$CURRENT" | cut -d. -f3 | cut -d- -f1)

          # Check if current version is a prerelease
          IS_PRERELEASE_VERSION=$(echo "$CURRENT" | grep -c '-' || true)

          # Apply bump
          BUMP="${{ steps.labels.outputs.bump }}"
          case "$BUMP" in
            promote)
              # Promote prerelease to stable - no version bump, just strip prerelease suffix
              if [ "$IS_PRERELEASE_VERSION" -eq 0 ]; then
                echo "::error::Cannot use 'promote' on a non-prerelease version. Use major/minor/patch instead."
                exit 1
              fi
              # Version numbers stay the same, prerelease suffix will not be added
              ;;
            major)
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
              ;;
            minor)
              MINOR=$((MINOR + 1))
              PATCH=0
              ;;
            patch)
              PATCH=$((PATCH + 1))
              ;;
          esac

          NEW_VERSION="${MAJOR}.${MINOR}.${PATCH}"

          # Handle prerelease
          if [ "${{ steps.labels.outputs.prerelease }}" == "true" ]; then
            PRETYPE="${{ steps.labels.outputs.pretype }}"

            # Find existing prerelease tags for this version
            EXISTING=$(git tag -l "v${NEW_VERSION}-${PRETYPE}.*" | sort -V | tail -1)
            if [ -n "$EXISTING" ]; then
              # Increment prerelease number
              PRE_NUM=$(echo "$EXISTING" | sed "s/v${NEW_VERSION}-${PRETYPE}\.\([0-9]*\)/\1/")
              PRE_NUM=$((PRE_NUM + 1))
            else
              PRE_NUM=1
            fi

            NEW_VERSION="${NEW_VERSION}-${PRETYPE}.${PRE_NUM}"
          fi

          echo "New version: $NEW_VERSION"
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$NEW_VERSION" >> $GITHUB_OUTPUT

      - name: Validate release changes
        run: |
          EXPECTED="${{ steps.version.outputs.new_version }}"
          MANIFEST_VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          LOCK_VERSION=$(awk '
            $0 == "name = \"papercut\"" { found=1; next }
            found && /^version = / {
              gsub(/version = "|"/, "")
              print
              exit
            }
          ' Cargo.lock)

          if [ "$MANIFEST_VERSION" != "$EXPECTED" ]; then
            echo "::error::Cargo.toml version is $MANIFEST_VERSION; expected $EXPECTED from the PR labels."
            exit 1
          fi

          if [ "$LOCK_VERSION" != "$EXPECTED" ]; then
            echo "::error::Cargo.lock package version is $LOCK_VERSION; expected $EXPECTED."
            exit 1
          fi

          if ! grep -q "^## \\[$EXPECTED\\]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no section for $EXPECTED."
            exit 1
          fi

          cargo check --locked

      - name: Tag release commit
        run: |
          git tag -s "${{ steps.version.outputs.tag }}" -m "Release ${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Extract changelog for release
        id: changelog
        run: |
          VERSION="${{ steps.version.outputs.new_version }}"

          # Extract section for this version
          NOTES=$(awk -v ver="$VERSION" '
            /^## \[/ {
              if (found) exit
              if (index($0, "[" ver "]") || index($0, "[Unreleased]")) found=1
              next
            }
            found { print }
          ' CHANGELOG.md)

          # Write to file for release body
          echo "$NOTES" > release_notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.tag }}
          body_path: release_notes.md
          prerelease: ${{ steps.labels.outputs.prerelease == 'true' }}
          draft: false

  build-macos:
    name: Build macOS DMG
    needs: release
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.tag }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: brew install librsvg create-dmg

      - name: Import Apple certificate
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          # Skip if no certificate provided
          if [ -z "$APPLE_CERTIFICATE_BASE64" ]; then
            echo "⚠️ No Apple certificate configured, skipping code signing"
            exit 0
          fi

          # Create temporary keychain
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Import certificate
          echo "$APPLE_CERTIFICATE_BASE64" | base64 --decode > $RUNNER_TEMP/certificate.p12
          security import $RUNNER_TEMP/certificate.p12 \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 \
            -k "$KEYCHAIN_PATH"

          # Allow codesign to access keychain
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"

          # Clean up certificate file
          rm $RUNNER_TEMP/certificate.p12

          # Find and export signing identity
          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep "Developer ID Application" | head -1 | awk -F'"' '{print $2}')
          if [ -n "$IDENTITY" ]; then
            echo "APPLE_SIGNING_IDENTITY=$IDENTITY" >> $GITHUB_ENV
            echo "✓ Found signing identity: $IDENTITY"
          else
            echo "⚠️ No Developer ID Application certificate found"
          fi

      - name: Build and package
        env:
          APPLE_SIGNING_IDENTITY: ${{ env.APPLE_SIGNING_IDENTITY }}
        run: |
          cd packaging/macos
          ./build-macos.sh
          ./create-dmg.sh

      - name: Notarize DMG
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # Skip if no signing identity or Apple ID
          if [ -z "$APPLE_SIGNING_IDENTITY" ] || [ -z "$APPLE_ID" ]; then
            echo "⚠️ Skipping notarization (missing signing identity or Apple ID)"
            exit 0
          fi

          DMG_FILE=$(ls dist/*.dmg | head -1)

          echo "📤 Submitting for notarization..."
          xcrun notarytool submit "$DMG_FILE" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_ID_PASSWORD" \
            --wait

          echo "📎 Stapling notarization ticket..."
          xcrun stapler staple "$DMG_FILE"

          echo "✓ Notarization complete"

      - name: Cleanup keychain
        if: always()
        run: |
          security delete-keychain $RUNNER_TEMP/app-signing.keychain-db 2>/dev/null || true

      - name: Upload DMG to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release.outputs.tag }}
          files: dist/*.dmg
