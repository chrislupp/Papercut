[package]
name = "papercut"
version = "1.0.0"
edition = "2021"
rust-version = "1.89"
authors = ["Christopher Lupp <christopherlupp@gmail.com>"]
description = "A CLI tool for converting source code files to PDF with configurable headers and footers"
license = "GPL-3.0"
repository = "https://github.com/chrislupp/Papercut"
readme = "README.md"

[dependencies]
# CLI argument parsing
clap = { version = "4.5", features = ["derive"] }

# Configuration parsing
serde = { version = "1.0", features = ["derive"] }
serde-saphyr = "1.0.0-rc.1"

# Embedded Typst typesetting and PDF export (no external CLI required)
typst = "0.14.2"
typst-pdf = "0.14.2"
typst-as-lib = { version = "0.15.4", features = ["typst-kit-fonts", "typst-kit-embed-fonts"] }

# Markdown parsing
pulldown-cmark = "0.12"

# Syntax highlighting (optional feature)
syntect = { version = "5.2", optional = true, default-features = false, features = ["default-fancy"] }

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# File operations and utilities
chrono = "0.4"
glob = "0.3"
walkdir = "2.5"
dirs = "5.0"

# Progress indicators and terminal detection
indicatif = "0.17"
is-terminal = "0.4"

[features]
default = ["syntax-highlighting"]
syntax-highlighting = ["syntect"]

[dev-dependencies]
tempfile = "3.20"

[[bin]]
name = "papercut"
path = "src/main.rs"
