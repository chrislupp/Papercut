[package]
name = "papercut"
version = "0.1.0"
edition = "2021"
authors = ["Your Name <your.email@example.com>"]
description = "A CLI tool for converting source code files to PDF with configurable headers and footers"
license = "GPL-3.0"
repository = "https://github.com/yourusername/papercut"
readme = "README.md"

[dependencies]
# CLI argument parsing
clap = { version = "4.5", features = ["derive"] }

# Configuration parsing
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"

# PDF generation
genpdf = "0.2"

# Syntax highlighting (optional feature)
syntect = { version = "5.2", optional = true, default-features = false, features = ["default-fancy"] }

# Error handling
anyhow = "1.0"
thiserror = "1.0"

# File operations and utilities
chrono = "0.4"
glob = "0.3"
walkdir = "2.5"

[features]
default = ["syntax-highlighting"]
syntax-highlighting = ["syntect"]

[[bin]]
name = "papercut"
path = "src/main.rs"
